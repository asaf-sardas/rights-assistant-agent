[project]
name = "rights-assistant-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "asaf-sardas", email = "asafsardas1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.8.3",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.23",
    "pydantic-settings>=2.16.3",
]

[project.scripts]
rights-assistant-agent = "rights_assistant_agent:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.43",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
